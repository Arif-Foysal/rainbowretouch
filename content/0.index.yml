title: Ship Your [SaaS]{class="text-primary"} at light speed
description: Build production-ready SaaS applications with Nuxt UI's powerful components, authentication flows, and enterprise features. The same component library trusted by the entire Nuxt ecosystem.
seo:
  title: Nuxt UI SaaS Template
  description: Create stunning, fast and production-ready SaaS applications with Nuxt UI. 100+ Vue components, authentication, dark mode, and enterprise features built on Tailwind CSS.
navigation: false
hero:
  links:
    - label: Get started
      icon: i-lucide-arrow-right
      trailing: true
      to: https://ui.nuxt.com/docs/getting-started/installation/nuxt
      target: _blank
      size: xl
    - label: Use this template
      icon: i-simple-icons-github
      size: xl
      color: neutral
      variant: subtle
      to: https://github.com/nuxt-ui-templates/saas
      target: _blank
sections:
  - title: Ecommerce Photo Editing Services
    description: Professional photo editing solutions tailored for e-commerce businesses to enhance product images and boost sales
    id: features
    orientation: horizontal
    image: /imagePoster/1.png
    features:
      - name: 100+ UI Components
        description: From buttons to modals, data tables to forms - all styled with Tailwind CSS and accessible out of the box.
        icon: i-lucide-package
      - name: Authentication Ready
        description: Pre-built login, signup, and password reset flows. Just connect your backend and start onboarding users.
        icon: i-lucide-shield
      - name: TypeScript First
        description: Full TypeScript support with auto-completion, type safety, and IntelliSense for every component and composable.
        icon: i-lucide-code-2
  - title: Professional Photo Retouching
    description: High-end retouching services to make your images look flawless while maintaining natural authenticity.
    orientation: horizontal
    reverse: true
    image: /imagePoster/3.png
    features:
      - name: Authentic Retouching
        description: High-end retouching that enhances beauty while maintaining a natural, authentic look.
        icon: i-lucide-check
      - name: Brand Consistency
        description: Flaw removal, skin smoothing, and lighting adjustments tailored to your brand style.
        icon: i-lucide-flag
      - name: Color Grading
        description: Premium color grading and finishing touches that elevate every photo.
        icon: i-lucide-droplet
features:
  title: Everything You Need to Ship
  description: Stop building from scratch. Focus on your unique features while Nuxt UI handles the foundations with battle-tested components and patterns.
  items:
    - title: Beautiful Design System
      description: Semantic color aliases, comprehensive design tokens, and Tailwind Variants for consistent, customizable styling.
      icon: i-lucide-palette
    - title: Accessible by Default
      description: Built on Reka UI for robust accessibility. WCAG compliant components that work for everyone, everywhere.
      icon: i-lucide-accessibility
    - title: Developer Experience
      description: Auto-imports, hot module replacement, and comprehensive documentation. Build faster with less friction.
      icon: i-lucide-terminal
    - title: SEO Optimized
      description: Server-side rendering, automatic meta tags, sitemap generation, and Open Graph images out of the box.
      icon: i-lucide-search
    - title: Production Ready
      description: Error handling, loading states, form validation, and security best practices built into every component.
      icon: i-lucide-check-circle
    - title: Infinitely Customizable
      description: Override any style with the ui prop, customize globally with AppConfig, or use Tailwind classes directly.
      icon: i-lucide-settings
