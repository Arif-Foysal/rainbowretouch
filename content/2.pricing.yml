faq:
  title: Frequently asked questions
  description: Everything you need to know about our pricing and services.
  items:
    - label: What's the difference between Standard and Bulk pricing?
      content: Standard pricing (1-5 items) is our per-project rate for small orders. Bulk pricing offers progressive discounts based on volume - 10-20 items get a small discount, 20-50 items get a medium discount, and 50+ items get our best rates. Higher volume = lower per-item cost.
    - label: How long does turnaround take?
      content: Turnaround times vary by plan - Basic (24 hours), Professional (12 hours), and Premium (6 hours). Rush services are available for an additional fee.
    - label: What file formats do you accept?
      content: We accept all major image formats including JPG, PNG, TIFF, PSD, and RAW files from all major camera brands.
    - label: Can I request revisions?
      content: Yes! Each plan includes a set number of revisions. Basic includes 2 revisions, Professional includes 5, and Premium includes unlimited revisions.
    - label: Do you offer refunds?
      content: If you're not satisfied with the final result, we'll work with you until you are. Refunds are considered on a case-by-case basis within 7 days of delivery.
    - label: How do I get started?
      content: Simply choose your plan, upload your images, and provide detailed instructions. We'll send you a proof for review before final delivery.
